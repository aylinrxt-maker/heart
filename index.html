<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>for Rasha ❤️</title>

<style>
body{
    margin:0;
    background:#000;
    overflow:hidden;
}
canvas{
    display:block;
}
</style>

</head>
<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

ctx.fillStyle = "#ff6bc1";
ctx.font = "bold 11px Arial";

let scale = 5;
let i = 0;

function draw(){

    if(scale>64){
        clearInterval(timer);
        return;
    }

    let angle = i * Math.PI * 2 / 50;

    let x = 16*Math.pow(Math.sin(angle),3);
    let y = 13*Math.cos(angle)
          - 5*Math.cos(2*angle)
          - 2*Math.cos(3*angle)
          - Math.cos(4*angle);

    ctx.fillText(
        "Rasha",
        canvas.width/2 + x*scale,
        canvas.height/2 - y*scale
    );

    i++;

    if(i>=50){
        i=0;
        scale += 0.5;
    }

}

let timer = setInterval(draw,15);

</script>

</body>
</html>
